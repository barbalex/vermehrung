services:
  db:
    image: vermehrung-db-dev
    build:
      context: ./db
    networks:
      - network
    # specify container name to make it easier to run commands.
    # for example, you could run docker exec -i postgres psql -U postgres postgres < schema.sql to run an SQL file against the Postgres database
    container_name: v_db
    restart: always
    env_file:
      - ./.env
    ports:
      # host port 5434 (not 5432): this stack must coexist with other local
      # projects claiming 5432/5433 (apf2, ae3). Update kanel.config.mjs
      # when changing this.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
      # applied on first init by init/04_api_access.sh (not in
      # /docker-entrypoint-initdb.d: createApiAccess.sql needs app.password)
      - ../src/sql/createApiAccess.sql:/api_sql/createApiAccess.sql:ro
      - ../src/sql/createSyncFunction.sql:/api_sql/createSyncFunction.sql:ro
    command: postgres -c max_locks_per_transaction=2000
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    platform: linux/amd64
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      # give the first-run restore of vermehrung.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  # the api: PostgREST over the db, JWT-authenticated
  # (roles, grants and row level security: src/sql/createApiAccess.sql)
  api:
    image: "postgrest/postgrest:v16.5"
    container_name: v_api
    ports:
      # host port 8090 (dev port block: 5434/8090/7010) to avoid conflicts
      # with other local projects. Update src/utils/constants.ts,
      # e2e/*.spec.ts and api-tests/helpers.ts when changing this.
      - "8090:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: always
    env_file:
      - ./.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # JSONPath syntax - the old JSPath '.role' is deprecated
      # (single quotes keep docker compose from touching the $)
      PGRST_ROLE_CLAIM_KEY: '$.role'
    networks:
      - network
  # mints the local api tokens (same service as production, built
  # from backend/auth - needs the FIREBASE_* and PGRST_* entries in .env)
  auth:
    build:
      context: ../backend/auth
    container_name: v_auth
    restart: always
    env_file:
      - ./.env
    ports:
      # host port 7010 (dev port block: 5434/8090/7010) to avoid conflicts
      # with other local projects. Update src/utils/constants.ts and
      # e2e/*.spec.ts when changing this.
      - "7010:7000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - network
volumes:
  db_data:
  sik_data:
networks:
  network:
