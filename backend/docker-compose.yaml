services:
  db:
    image: vermehrung-db
    build:
      context: ./db
    # specify container name to make it easier to run commands.
    # for example, you could run docker exec -i postgres psql -U postgres postgres < schema.sql to run an SQL file against the Postgres database
    container_name: v_db
    restart: always
    env_file:
      - ./.env
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
      # keep the rclone config (nextcloud backup target) across container recreations
      - /root/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
    command: postgres -c max_locks_per_transaction=2000
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      # give the first-run restore of vermehrung.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  auth:
    build:
      context: ./auth
    container_name: v_auth
    restart: always
    env_file:
      - ./.env
    expose:
      - "7000"
    ports:
      - "7000:7000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
  # the api: PostgREST over the db, JWT-authenticated
  # (roles, grants and row level security: src/sql/createApiAccess.sql)
  api:
    image: "postgrest/postgrest:v16.5"
    container_name: v_api
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: always
    env_file:
      - ./.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ROLE_CLAIM_KEY: .role
  caddy:
    # https://hub.docker.com/r/caddy/caddy/tags
    image: "caddy:2.11.7-alpine"
    container_name: v_caddy
    depends_on:
      db:
        condition: service_healthy
        restart: true
      api:
        condition: service_started
        restart: true
      auth:
        condition: service_started
        restart: true
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_certs:/data/caddy
      - caddy_config:/root/.config/caddy
volumes:
  db_data:
  caddy_certs:
  sik_data:
  caddy_config:
