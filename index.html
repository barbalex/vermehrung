<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs during HTML parse, before any JS bundle. The home page's
      // critical requests (hero image, placeholder, route chunks) are
      // only discovered after React has mounted - preload them early.
      // This file is the shell for every route, so only preload when
      // actually on /. The placeholders are replaced at build time by
      // the homeCriticalPreloads plugin: Vite does not rewrite asset
      // URLs inside inline scripts.
      ;(() => {
        if (window.location.pathname !== '/') return
        const addLink = (attrs) => {
          const link = document.createElement('link')
          for (const [key, value] of Object.entries(attrs))
            link.setAttribute(key, value)
          document.head.appendChild(link)
        }
        // the full image is the LCP element
        addLink({
          rel: 'preload',
          as: 'image',
          type: 'image/webp',
          href: '__HERO_URL__',
          fetchpriority: 'high',
        })
        addLink({
          rel: 'preload',
          as: 'image',
          type: 'image/webp',
          href: '__PLACEHOLDER_URL__',
        })
        for (const href of __MODULE_URLS__)
          addLink({ rel: 'modulepreload', crossorigin: '', href })
      })()
    </script>
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/favicon_192.png"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="mask-icon"
      href="/favicon.svg"
      color="#2e0c58"
    />
    <meta
      name="msapplication-TileColor"
      content="#2e0c58"
    />
    <meta
      name="theme-color"
      content="#2e0c58"
    />
    <meta
      name="background-color"
      content="#2e0c58"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Bedrohte Pflanzenarten vermehren"
    />
    <meta
      name="keywords"
      content="Naturschutz, Artenschutz, Flora, Pflanzen, Vermehrung"
    />
    <title>Vermehrung</title>
    <script>
      // Runs before first paint. Resolves the stored theme mode
      // ('system' | 'light' | 'dark', JSON-encoded by jotai's
      // atomWithStorage) against the OS preference and sets
      // html[data-theme] + color-scheme, so dark mode does not flash.
      // App.jsx keeps both in sync afterwards.
      ;(() => {
        let storedThemeMode
        try {
          storedThemeMode = JSON.parse(
            localStorage.getItem('vermehrung:theme-mode') ?? 'null',
          )
        } catch {
          storedThemeMode = null
        }
        const isDark =
          storedThemeMode === 'dark' ||
          (storedThemeMode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        const html = document.documentElement
        html.dataset.theme = isDark ? 'dark' : 'light'
        html.style.colorScheme = isDark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDark ? '#121212' : '#2e0c58')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
