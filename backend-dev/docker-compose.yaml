services:
  db:
    image: vermehrung-db-dev
    build:
      context: ./db
    networks:
      - network
    # specify container name to make it easier to run commands.
    # for example, you could run docker exec -i postgres psql -U postgres postgres < schema.sql to run an SQL file against the Postgres database
    container_name: v_db
    restart: always
    env_file:
      - ./.env
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
    command: postgres -c max_locks_per_transaction=2000
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    platform: linux/amd64
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      # give the first-run restore of vermehrung.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  # the api: PostgREST over the db, JWT-authenticated
  # (roles, grants and row level security: src/sql/createApiAccess.sql)
  api:
    image: "postgrest/postgrest:v16.5"
    container_name: v_api
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: always
    env_file:
      - ./.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ROLE_CLAIM_KEY: .role
    networks:
      - network
  # hasura only remains for the migration period: the permission
  # equivalence tests (npm run test:api) use it as the oracle.
  # start with: docker compose -f backend-dev/docker-compose.yaml --profile migration up
  graphql:
    profiles:
      - migration
    image: "hasura/graphql-engine:v2.51.0"
    container_name: v_graphql
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: always
    env_file:
      - ./.env
    command:
      - graphql-engine
      - serve
    networks:
      - network
volumes:
  db_data:
  sik_data:
networks:
  network:
